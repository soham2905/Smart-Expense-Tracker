<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - Smart Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0">Add New Expense</h4>
                </div>
                <div class="card-body">

                    <!-- th:object binds this form to the "expense" model attribute (an Expense instance) -->
                    <form th:action="@{/expenses/add}" th:object="${expense}" method="post">

                        <div class="mb-3">
                            <label class="form-label" for="description">Description</label>
                            <input type="text" class="form-control" id="description"
                                   th:field="*{description}" placeholder="e.g. Lunch at canteen">
                            <!-- Shows the validation error message set on the "description" field, if any -->
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}"
                                 th:errors="*{description}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="amount">Amount (₹)</label>
                            <input type="number" step="0.01" class="form-control" id="amount"
                                   th:field="*{amount}" placeholder="e.g. 150.00">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('amount')}"
                                 th:errors="*{amount}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="category">Category</label>
                            <select class="form-select" id="category" th:field="*{category}">
                                <option value="" disabled>-- Select a category --</option>
                                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('category')}"
                                 th:errors="*{category}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="date">Date</label>
                            <input type="date" class="form-control" id="date" th:field="*{date}">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('date')}"
                                 th:errors="*{date}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Expense</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
