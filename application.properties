# --- Application ---
spring.application.name=smart-expense-tracker
server.port=8080

# --- H2 in-memory database ---
# "mem:expensedb" means the data lives only in RAM and resets every time the app restarts.
spring.datasource.url=jdbc:h2:mem:expensedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# "update" = Hibernate auto-creates/updates tables from the @Entity classes (fine for a hackathon demo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 web console (handy for peeking at the raw data during the demo) ---
# Visit http://localhost:8080/h2-console while the app is running.
# JDBC URL to use in the console login screen: jdbc:h2:mem:expensedb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Thymeleaf ---
# Disabling cache means template changes show up without restarting the app (useful while developing)
spring.thymeleaf.cache=false
