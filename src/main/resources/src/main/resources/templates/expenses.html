<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Expenses - Smart Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container mb-5">

    <!-- Flash success message set via RedirectAttributes after add/edit/delete -->
    <div class="alert alert-success" role="alert" th:if="${successMessage}">
        <span th:text="${successMessage}"></span>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="mb-0">All Expenses</h2>
        <a href="/expenses/add" class="btn btn-primary">+ Add Expense</a>
    </div>

    <!-- Feature 6: Category filter -->
    <form th:action="@{/expenses}" method="get" class="row g-2 mb-3">
        <div class="col-auto">
            <label for="category" class="col-form-label">Filter by category:</label>
        </div>
        <div class="col-auto">
            <select class="form-select" id="category" name="category">
                <option value="All" th:selected="${selectedCategory == 'All'}">All</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat}"
                        th:text="${cat}"
                        th:selected="${selectedCategory == cat}"></option>
            </select>
        </div>
        <div class="col-auto">
            <!-- No JavaScript auto-submit here (project has zero JS) — the user clicks Apply -->
            <button type="submit" class="btn btn-outline-primary">Apply</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th class="text-end">Amount (₹)</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="expense : ${expenses}">
                    <td th:text="${#temporals.format(expense.date, 'dd-MM-yyyy')}"></td>
                    <td th:text="${expense.description}"></td>
                    <td><span class="badge bg-primary badge-category" th:text="${expense.category}"></span></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(expense.amount, 1, 2)}"></td>
                    <td class="text-center">
                        <a th:href="@{/expenses/edit/{id}(id=${expense.id})}"
                           class="btn btn-sm btn-outline-warning">Edit</a>
                        <!-- No confirm() dialog here (project has zero JS) — delete is a direct link -->
                        <a th:href="@{/expenses/delete/{id}(id=${expense.id})}"
                           class="btn btn-sm btn-outline-danger">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(expenses)}">
                    <td colspan="5" class="text-center text-muted py-4">No expenses found for this filter.</td>
                </tr>
                </tbody>
                <tfoot th:if="${!#lists.isEmpty(expenses)}">
                <tr class="table-light fw-bold">
                    <td colspan="3" class="text-end">Total</td>
                    <td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(total, 1, 2)}"></td>
                    <td></td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>

</div>

</body>
</html>
